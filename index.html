<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>For Hager ❤️</title>

<style>
body{
    background:#ffdbe8;
    text-align:center;
    font-family:Arial;
    padding-top:40px;
    overflow:hidden;
}

h1{
    color:#d63384;
}

#mainPic{
    width:220px;
    border-radius:20px;
    margin:20px;
}

button{
    border:none;
    padding:15px 30px;
    margin:10px;
    font-size:22px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

#yesBtn{
    background:green;
    color:white;
}

#noBtn{
    background:red;
    color:white;
}

#final{
    display:none;
    margin-top:30px;
}

.cat{
    font-size:80px;
    animation:dance .6s infinite alternate;
}

@keyframes dance{
    from{
        transform:translateX(-10px) rotate(-8deg);
    }
    to{
        transform:translateX(10px) rotate(8deg);
    }
}
</style>
</head>
<body>

<h1>بحبك يا هاجر ممكن نرجع؟ ❤️</h1>

<img id="mainPic" src="main.jpg">

<br>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<div id="final">
    <h2>
    معدش هعمل كدا تاني والله وعد<br>
    انتي احلي حاجة حصلت ليا في حياتي<br>
    محدش يهمني غيرك بحبك ❤
    </h2>

    <div class="cat">😸💖</div>
</div>

<script>
let size=1;

document.getElementById("noBtn").onclick=function(){
   size+=0.3;
   document.getElementById("yesBtn").style.transform=
   `scale(${size})`;
}

document.getElementById("yesBtn").onclick=function(){
   document.getElementById("final").style.display="block";
}
</script>

</body>
</html>
